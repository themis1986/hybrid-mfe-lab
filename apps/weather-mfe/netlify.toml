[build]
  # Run from the repo root so pnpm/turbo can build workspace packages like the UI libraries first
  command = "cd ../.. && pnpm turbo run build --filter=@repo/weather-mfe..."
  publish = "dist"

# Lets the shell (a different origin) load this app's files
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Keep the federation entry fresh, so the shell never loads a stale remote
[[headers]]
  for = "/remoteEntry.js"
  [headers.values]
    Cache-Control = "no-cache"

# Only used if the app also runs standalone with client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
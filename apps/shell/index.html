<html lang="en">

    <title>The L@b</title>
    <!-- Applies the stored colour scheme before the first paint, so the page doesn't flash (src/theme.ts). -->
    <script>
      try {
        const theme = localStorage.getItem('the-lab:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

packages:
  - apps/*
  - packages/*

# Single source of truth for dependency versions; packages reference these with "catalog:".
catalog:
  # The @dnd-kit packages are released together: keep the three ranges equal. Pre-1.0, so a caret stays on 0.5.x.
  '@dnd-kit/abstract': ^0.5.3
  '@dnd-kit/dom': ^0.5.3
  '@dnd-kit/react': ^0.5.3
  '@internationalized/date': ^3.12.4
  '@lucide/vue': ^1.64.0
  '@module-federation/vite': ^1.23.5
  '@r2wc/react-to-web-component': ^2.1.1
  '@radix-ui/react-accordion': ^1.3.1
  '@radix-ui/react-checkbox': ^1.4.1
  '@radix-ui/react-collapsible': ^1.2.1
  '@radix-ui/react-dialog': ^1.3.1
  '@radix-ui/react-dropdown-menu': ^2.2.1
  '@radix-ui/react-label': ^2.1.17
  '@radix-ui/react-popover': ^1.3.1
  '@radix-ui/react-progress': ^1.2.1
  '@radix-ui/react-radio-group': ^1.5.1
  '@radix-ui/react-select': ^2.4.1
  '@radix-ui/react-slider': ^1.6.1
  '@radix-ui/react-slot': ^1.5.0
  '@radix-ui/react-switch': ^1.4.1
  '@radix-ui/react-tabs': ^1.2.1
  '@radix-ui/react-toast': ^1.3.1
  '@radix-ui/react-tooltip': ^1.4.1
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/vue-query': ^5.105.2
  '@types/geojson': ^7946.0.16
  '@types/node': ^22.20.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitejs/plugin-vue': ^6.0.10
  '@vitejs/devtools': ^0.7.6
  '@vitejs/devtools-vite': ^0.7.6
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  # Proprietary license (free for personal and educational use only): see packages/chart-core/README.md.
  highcharts: ^13.1.1
  # lucide-react and @lucide/vue are released together: keep both ranges equal, so the icon sets match.
  lucide-react: ^1.64.0
  # Proprietary license (Mapbox Terms of Service), needs an access token: see packages/map-core/README.md.
  mapbox-gl: ^3.34.1
  pinia: ^4.1.0
  prettier: ^3.8.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.0
  reka-ui: ^2.11.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  uuid: ^14.0.3
  vite: ^8.3.5
  vite-plugin-vue-devtools: ^9.0.0-rc.2
  vue: ^3.5.44
  vue-router: ^5.4.0
  vue-tsc: ^3.3.13

# vue-demi (via @tanstack/vue-query) only picks a Vue 2 or 3 build in its postinstall; its default is Vue 3.
allowBuilds:
  vue-demi: false
